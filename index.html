<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новый тур</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: #000; overflow: hidden; }
    #panorama { width: 100vw; height: 100vh; }
    .logo { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.9); color: white; padding: 12px 22px; border-radius: 14px; font-weight: 700; backdrop-filter: blur(12px); font-size: 15px; }
    .carousel { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(0,0,0,0.9); padding: 12px 16px; border-radius: 18px; backdrop-filter: blur(12px); max-width: 92vw; overflow-x: auto; }
    .carousel.side { bottom: auto; top: 50%; left: 20px; transform: translateY(-50%); flex-direction: column; }
    .carousel-item { width: 86px; height: 54px; border-radius: 10px; cursor: pointer; border: 2px solid transparent; object-fit: cover; transition: all 0.2s; }
    .carousel-item.active, .carousel-item:hover { border-color: #6366f1; transform: scale(1.06); }
    .about-btn { position: absolute; top: 20px; right: 20px; background: #6366f1; color: white; border: none; padding: 11px 18px; border-radius: 10px; cursor: pointer; font-weight: 600; }
    .progress-bar { position: absolute; top: 0; left: 0; height: 4px; background: #6366f1; width: 0%; transition: width 0.4s; z-index: 200; }
  </style>
</head>
<body>
  <div class="progress-bar" id="progress"></div>
  <div id="panorama"></div>
  <div class="logo">Моя компания</div>
  <button class="about-btn" onclick="alert('Информация о туре')">Об аудитории</button>
  <div class="carousel " id="carousel"></div>
  

  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
  <script>
    const config = {
      default: { firstScene: "scene_1795547310211_jgxu2", sceneFadeDuration: 1000, autoLoad: true, autoRotate: 0, showControls: true },
      scenes: {
  "scene_1795547310211_jgxu2": {
    "type": "equirectangular",
    "panorama": "panoramas/scene_1795547310211_jgxu2.jpg",
    "pitch": -1.8124122603259827,
    "yaw": -124.56831489353664,
    "hfov": 104.67209601608991,
    "hotSpots": [
      {
        "pitch": 1,
        "yaw": 6,
        "type": "info",
        "text": "Новый хотспот"
      }
    ]
  },
  "scene_1795547356868_dsbxk": {
    "type": "equirectangular",
    "panorama": "panoramas/scene_1795547356868_dsbxk.jpg",
    "pitch": 7.407131187838107,
    "yaw": 164.69568908382644,
    "hfov": 120,
    "hotSpots": []
  }
}
    };
    const viewer = pannellum.viewer("panorama", config);

    
    viewer.on("load", () => {
      const p = document.getElementById("progress");
      if (p) { p.style.width = "100%"; setTimeout(() => p.style.opacity = "0", 600); }
    });

    
    const carousel = document.getElementById("carousel");
    const scenes = [{"id":"scene_1795547310211_jgxu2","name":"стены — R0010292"},{"id":"scene_1795547356868_dsbxk","name":"Синяя комната — R0010278"}];
    scenes.forEach(scene => {
      const img = document.createElement("img");
      img.src = "panoramas/" + scene.id + ".jpg";
      img.className = "carousel-item";
      img.title = scene.name;
      img.onclick = () => viewer.loadScene(scene.id);
      carousel.appendChild(img);
    });
    viewer.on("scenechange", (sceneId) => {
      document.querySelectorAll(".carousel-item").forEach((el, i) => {
        el.classList.toggle("active", scenes[i].id === sceneId);
      });
    });

    
  </script>
</body>
</html>
